services:
  postgres:
    image: postgres:15-alpine
    container_name: umacore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: umacore
      POSTGRES_USER: umacore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./umacore_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umacore"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      umacore-net:
        aliases:
          - postgres
          - umacore-postgres
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  umacore-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umacore-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://umacore:${POSTGRES_PASSWORD}@postgres:5432/umacore
      - TRACKER_WEBHOOK_URL=http://uma-tracker:8080/trigger
    networks:
      - umacore-net
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: umacore-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: umacore
      POSTGRES_USER: umacore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "0 3 * * 0"
      BACKUP_KEEP_WEEKS: 4
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
    networks:
      - umacore-net
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:

networks:
  umacore-net:
    name: umacore-net
