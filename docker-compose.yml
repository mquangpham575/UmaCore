services:
  umacore-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umacore-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
